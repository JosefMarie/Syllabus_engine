<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Outer ambient glow ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#cyanGrad)" stroke-width="3" opacity="0.25" />

  <!-- Digital Syllabus Book & Code Icon -->
  <g transform="translate(96, 96)">
    <!-- Book Left Page -->
    <path d="M 160 80 Q 80 70 20 90 L 20 260 Q 80 240 160 250 Z" 
          fill="url(#cyanGrad)" opacity="0.9" />
    <!-- Book Right Page -->
    <path d="M 160 80 Q 240 70 300 90 L 300 260 Q 240 240 160 250 Z" 
          fill="url(#cyanGrad)" opacity="0.75" />
    <!-- Center Spine -->
    <line x1="160" y1="75" x2="160" y2="255" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

    <!-- Code Brackets Overlay <> in Gold -->
    <path d="M 110 135 L 75 170 L 110 205" 
          fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <path d="M 210 135 L 245 170 L 210 205" 
          fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <line x1="175" y1="135" x2="145" y2="205" 
          stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Level 5 Accent Dot -->
  <circle cx="256" cy="400" r="10" fill="#10B981" />
</svg>
